name: CI

on:
  push:
    branches:
      - main
      - fix/flaky-test-msvc
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/CI.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/CI.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests for platform  ${{ matrix.os }}/${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-musl
          #   coverage: true
          #   conventional_commit_check: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            force_lf: truhow to update the CI to trigger test, lint and build only when the rust crate is modified ?e
          # - os: ubuntu-latest
          #   target: armv7-unknown-linux-musleabihf
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu
    steps:
      - if: ${{ matrix.force_lf }}
        run: |
          git config --global core.eol lf;
          git config --global core.autocrlf input;

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          key: "${{ matrix.os }}-${{ matrix.target }}"

      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git config --global user.email github-actions@github.com
          git config --global user.name github-actions

      # Reenable when manually released
      # - name: Conventional commit check
      #   if: ${{matrix.conventional_commit_check }}
      #   uses: cocogitto/cocogitto-action@v3
      #   with:
      #     git-user: "github-actions"
      #     git-user-email: "github-actions@github.com"

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        uses: actions-rs/cargo@v1
        with:
          command: nextest
          args: run
        env:
          NEXTEST_RETRIES: 2
          NEXTEST_TEST_THREADS: 2
